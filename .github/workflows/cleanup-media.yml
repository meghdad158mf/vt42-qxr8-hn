name: Cleanup old post media

on:
  # زمان‌بندی با pg_cron سوپابیس (db/migration_040_cron_scheduler.sql) — سر وقت دقیق
  # همین workflow_dispatch رو صدا می‌زنه. schedule گیت‌هاب برداشته شد چون ۱–۲ ساعت
  # تأخیر داشت و نوبت‌ها رو جا می‌انداخت (و با هر دو، هر کار دوبار اجرا می‌شد).
  # برنامه (UTC) — موقع مهاجرت به VPS همین‌ها به crontab سرور منتقل بشن:
  #   15 6 * * *
  #   15 18 * * *
  # ⚠️ هماهنگ با RETENTION_DAYS=0.5 در scripts/cleanup_media.py (هر ۱۲ ساعت).
  workflow_dispatch:       # امکان اجرای دستی از تب Actions
    inputs:
      retention_days_override:
        description: "پاک‌سازی فوری: عدد روز جایگزین (مثلاً 0.02 ~ نیم ساعت) فقط برای همین یه اجرا — RETENTION_DAYS دائمی توی کد دست‌نخورده می‌مونه. خالی بذار برای رفتار عادی."
        required: false
        type: string

# دو اجرای هم‌زمان (زمان‌بندی + «اجرای دستی» از صفحه‌ی وضعیت) نشه — برای تلگرام
# استفاده‌ی هم‌زمان از یک نشست از دو سرور می‌تونه نشست رو باطل کنه؛ اجرای دوم صبر می‌کنه
concurrency:
  group: cleanup-media
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/cleanup_media.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RETENTION_DAYS_OVERRIDE: ${{ github.event.inputs.retention_days_override }}
