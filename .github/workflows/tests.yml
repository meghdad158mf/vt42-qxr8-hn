name: Site tests

# بررسی ایستا (eslint)، آزمون‌های واحد هسته (tests/unit) و آزمون‌های مرورگر سایت (tests/e2e)
# با داده‌ی ساختگی، روی همان خروجی ساخته‌شده‌ای که منتشر می‌شود (dist/)، و آزمون‌های پایتون
# کالکتورها (tests/python، بدون شبکه). روی هر PR به شاخه‌ی
# زنده؛ اگر قرمز شد، PR ادغام نشود (گزارش کامل در Artifacts). انتشار خودِ سایت: pages.yml
on:
  pull_request:
    branches: [claude/new-project-8ekywm]
  workflow_dispatch: {}

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dist
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests/python -v
      # سرور ایران: به‌روزرسان /update و ساخت بسته (بدون شبکه/پایگاه داده)
      - run: bash -n server/install.sh server/check.sh && python -m py_compile server/updater/*.py server/tools/*.py server/core/services/*.py && bash -n server/core/hooks/preinstall server/core/hooks/activate
      - run: python -m unittest discover -s tests/server -v
