name: Site tests

# بررسی ایستا (eslint)، آزمون‌های واحد هسته (tests/unit) و آزمون‌های مرورگر سایت (tests/e2e)
# با داده‌ی ساختگی، روی همان خروجی ساخته‌شده‌ای که منتشر می‌شود (dist/). روی هر PR به شاخه‌ی
# زنده؛ اگر قرمز شد، PR ادغام نشود (گزارش کامل در Artifacts). انتشار خودِ سایت: pages.yml
on:
  pull_request:
    branches: [claude/new-project-8ekywm]
  workflow_dispatch: {}

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dist
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
