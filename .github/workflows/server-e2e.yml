name: Server e2e

# آزمون سرتاسری سرور ایران روی Ubuntu 24.04 واقعی (با systemd): نصب پایه، نصب بسته‌ی سرور از
# راه /update، صفحه‌ی /setup و ورود با رمز و پیامک، فایل‌ها، سایت، تابع‌ها، کارهای خودکار، پیوند
# سرور خارجی، انتقال داده، گواهی دامنه، و برگشت خودکار بسته‌ی خراب.
on:
  push:
    branches: ['claude/**']
    paths: ['server/**', 'db/**', 'scripts/**', 'supabase/functions/**', 'design/**', 'tests/server/**', '.github/workflows/server-e2e.yml']
  pull_request:
    branches: [claude/new-project-8ekywm]
    paths: ['server/**', 'db/**', 'scripts/**', 'supabase/functions/**', 'tests/server/**', '.github/workflows/server-e2e.yml']
  workflow_dispatch: {}

concurrency:
  group: server-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: نصب پایه
        run: sudo JARYAN_TEST_NO_SYSTEMD=1 bash server/install.sh < /dev/null
      - name: ساخت بسته‌ها
        run: |
          python3 server/tools/build_core.py --out /tmp
          bash tests/server/make_broken.sh /tmp/jaryan-server-$(cat server/core/VERSION).jaryan /tmp/broken.jaryan
          ls -la /tmp/*.jaryan
      - name: آزمون سرتاسری
        run: sudo python3 tests/server/e2e_client.py /root/jaryan-emergency-key.txt /tmp/jaryan-server-$(cat server/core/VERSION).jaryan /tmp/broken.jaryan
      - name: فهرست جدول‌های انتقال = پایگاه داده‌ی واقعی
        run: |
          sudo python3 - <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, "/opt/jaryan/current/services")
          import transfer as t
          parsed = t.tables_from_sql(t.sql_files())
          q = """select coalesce(json_object_agg(c.relname, coalesce((select json_agg(a.attname order by k.ord)
                   from pg_index i cross join unnest(i.indkey) with ordinality k(attnum, ord)
                   join pg_attribute a on a.attrelid = i.indrelid and a.attnum = k.attnum
                  where i.indrelid = c.oid and i.indisprimary), '[]')), '{}')
                 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relkind in ('r','p')"""
          real = json.loads(subprocess.run(["runuser", "-u", "postgres", "--", "psql", "-d", "jaryan", "-Atc", q],
                                           capture_output=True, text=True, check=True).stdout)
          bad = [f"{k}: migration={parsed.get(k)} واقعی={real.get(k)}" for k in sorted(set(parsed) | set(real))
                 if parsed.get(k) != real.get(k)]
          print(len(parsed), "جدول؛ تفاوت:", bad or "هیچ")
          sys.exit(1 if bad else 0)
          PY
      - name: آزمون سایت روی سرور
        run: |
          npx playwright install --with-deps chromium
          node tests/server/site_smoke.mjs
      - name: گزارش‌ها
        if: failure()
        run: |
          sudo tail -n 80 /var/log/jaryan-install.log || true
          sudo journalctl -u jaryan-updater -u jaryan-api -u jaryan-net -u jaryan-setup -u jaryan-storage -u jaryan-functions -u jaryan-jobs -u nginx -n 200 --no-pager || true
          sudo sh -c 'tail -n 150 /var/lib/jaryan/updater/logs/*.log' || true
          sudo sh -c 'tail -n 60 /var/lib/jaryan/jobs/logs/*.log' || true
