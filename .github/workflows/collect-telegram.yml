name: Collect Telegram messages

on:
  schedule:
    - cron: "15 */2 * * *"   # هر ۲ ساعت (۱۵ دقیقه اختلاف با ورک‌فلوی ایتا)
  workflow_dispatch: {}

# دو اجرای هم‌زمان (زمان‌بندی + «اجرای دستی» از صفحه‌ی وضعیت) نشه — برای تلگرام
# استفاده‌ی هم‌زمان از یک نشست از دو سرور می‌تونه نشست رو باطل کنه؛ اجرای دوم صبر می‌کنه
concurrency:
  group: collect-telegram
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/collect_telegram.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
