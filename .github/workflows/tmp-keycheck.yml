name: tmp key check
on:
  push:
    branches: ['claude/exciting-wright-px9qdv']
    paths: ['.github/workflows/tmp-keycheck.yml']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, http.client
          K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvbXFuYXBmcXJ0eHhheXRwY2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTQwMDUsImV4cCI6MjEwNDE3MDAwNX0.eh9DpJ_uO5b21IH4e3rGYIPCJOEO5ZWMiomh7kUxArU'
          H='komqnapfqrtxxaytpcdt.supabase.co'
          def ul(path, body=None, extra=None):
              h={"apikey":K,"Content-Type":"application/json"}; h.update(extra or {})
              r=urllib.request.Request("https://"+H+path, data=json.dumps(body).encode() if body is not None else None, headers=h, method="POST" if body is not None else "GET")
              try:
                  with urllib.request.urlopen(r, timeout=30) as x: return x.status, x.read()[:150]
              except urllib.error.HTTPError as e: return e.code, e.read()[:200]
          def hc(path, name):
              c=http.client.HTTPSConnection(H, timeout=30); c.putrequest("GET", path); c.putheader(name, K); c.endheaders()
              x=c.getresponse(); return x.status, x.read()[:150]
          print("urllib GET  ", ul("/rest/v1/site_settings?select=key&limit=1"))
          print("urllib login", ul("/rest/v1/rpc/login", {"password":"wrong-test"}))
          print("raw apikey  ", hc("/rest/v1/site_settings?select=key&limit=1", "apikey"))
          print("raw Apikey  ", hc("/rest/v1/site_settings?select=key&limit=1", "Apikey"))
          PY
