name: tmp key check
on:
  push:
    branches: ['claude/exciting-wright-px9qdv']
    paths: ['.github/workflows/tmp-keycheck.yml', 'server/core/services/transfer.py']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import sys, urllib.parse
          sys.path.insert(0, "server/core/services")
          import transfer as t
          sb = t.Supa()
          defs = t.table_defs(sb)
          ok = bad = 0
          for name in sorted(defs):
              try:
                  sb.call("GET", f"/rest/v1/{name}?select=*&limit=1")
                  ok += 1
              except Exception as e:
                  bad += 1; print("  ", name, e)
          print("tables readable:", ok, "not:", bad)
          for b in ["magazines", "channel-avatars", "post-media"]:
              names = t.list_bucket(sb, b, "")
              print(b, len(names))
              if names:
                  data, hdr = sb.req("GET", f"/storage/v1/object/authenticated/{b}/" + urllib.parse.quote(names[0]), raw=True)
                  print("  download ok", len(data))
          PY
