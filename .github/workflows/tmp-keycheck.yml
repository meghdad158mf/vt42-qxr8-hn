name: tmp key check
on:
  push:
    branches: ['claude/exciting-wright-px9qdv']
    paths: ['.github/workflows/tmp-keycheck.yml']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - env:
          SK: ${{ secrets.SUPABASE_ANON_KEY }}
          SU: ${{ secrets.SUPABASE_URL }}
        run: |
          K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvbXFuYXBmcXJ0eHhheXRwY2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTQwMDUsImV4cCI6MjEwNDE3MDAwNX0.eh9DpJ_uO5b21IH4e3rGYIPCJOEO5ZWMiomh7kUxArU'
          U=https://komqnapfqrtxxaytpcdt.supabase.co
          echo "secret url same: $([ "${SU%/}" = "$U" ] && echo yes || echo no)"
          echo "secret key prefix: ${SK:0:6}  len ${#SK}  same-as-site: $([ "$SK" = "$K" ] && echo yes || echo no)"
          echo "site key:   $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $K" "$U/rest/v1/site_settings?select=key&limit=1")"
          echo "secret key: $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SK" "$U/rest/v1/site_settings?select=key&limit=1")"
          curl -s -H "apikey: $K" "$U/rest/v1/site_settings?select=key&limit=1" | head -c 300; echo
