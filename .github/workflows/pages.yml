name: Publish site

# انتشار سایت روی GitHub Pages از خروجی Vite (dist/) — جایگزین انتشار مستقیم شاخه.
# ⚠️ یک‌بار لازم است: Settings ← Pages ← Build and deployment ← Source = «GitHub Actions».
# آدرس‌ها همان قبلی‌اند: /design/ita-monitoring-prototype.html، /brand-kit/، /feature-kit/
# اگر بررسی‌ها شکست بخورند، چیزی منتشر نمی‌شود و نسخه‌ی قبلی سر جایش می‌ماند.
# ۵.۳۶.۱: آزمون‌های مرورگر اینجا تکرار نمی‌شوند — همان کد پیش از مرج در tests.yml کامل آزموده شده
# (شرط: شاخه‌ی PR پیش از مرج با شاخه‌ی زنده به‌روز باشد، CLAUDE.md). lint، آزمون واحد و ساخت می‌مانند.
on:
  push:
    branches: [claude/new-project-8ekywm]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
