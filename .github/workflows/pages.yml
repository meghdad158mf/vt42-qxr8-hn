name: Publish site

# انتشار سایت روی GitHub Pages از خروجی Vite (dist/) — جایگزین انتشار مستقیم شاخه.
# ⚠️ یک‌بار لازم است: Settings ← Pages ← Build and deployment ← Source = «GitHub Actions».
# آدرس‌ها همان قبلی‌اند: /design/ita-monitoring-prototype.html، /brand-kit/، /feature-kit/
# اگر آزمون‌ها شکست بخورند، چیزی منتشر نمی‌شود و نسخه‌ی قبلی سر جایش می‌ماند.
on:
  push:
    branches: [claude/new-project-8ekywm]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dist
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
