name: Collect Bale claims-watch posts

on:
  schedule:
    - cron: "30 1,5,7,9,11,13,15,17 * * *"   # ۵،۹،۱۱،۱۳،۱۵،۱۷،۱۹،۲۱ به وقت ایران (UTC+3:30)
  workflow_dispatch: {}      # امکان اجرای دستی از تب Actions

# دو اجرای هم‌زمان (زمان‌بندی + «اجرای دستی» از صفحه‌ی وضعیت) نشه — برای تلگرام
# استفاده‌ی هم‌زمان از یک نشست از دو سرور می‌تونه نشست رو باطل کنه؛ اجرای دوم صبر می‌کنه
concurrency:
  group: collect-bale
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/collect_bale.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
