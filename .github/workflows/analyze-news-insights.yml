name: Analyze news insights (AI)

# روزی چهار بار — ۰۲:۰۰، ۰۸:۰۰، ۱۴:۰۰ و ۲۰:۰۰ به وقت ایران (UTC+03:30) —
# یعنی هر ۶ ساعت، دقیقاً هم‌راستا با WINDOW_HOURS توی scripts/analyze_news_insights.py
on:
  # زمان‌بندی با pg_cron سوپابیس (db/migration_040_cron_scheduler.sql) — سر وقت دقیق
  # همین workflow_dispatch رو صدا می‌زنه. schedule گیت‌هاب برداشته شد چون ۱–۲ ساعت
  # تأخیر داشت و نوبت‌ها رو جا می‌انداخت (و با هر دو، هر کار دوبار اجرا می‌شد).
  # برنامه (UTC) — موقع مهاجرت به VPS همین‌ها به crontab سرور منتقل بشن:
  #   30 4,10,16,22 * * *
  workflow_dispatch: {}

# دو اجرای هم‌زمان (زمان‌بندی + «اجرای دستی» از صفحه‌ی وضعیت) نشه — برای تلگرام
# استفاده‌ی هم‌زمان از یک نشست از دو سرور می‌تونه نشست رو باطل کنه؛ اجرای دوم صبر می‌کنه
concurrency:
  group: analyze-news-insights
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/analyze_news_insights.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
