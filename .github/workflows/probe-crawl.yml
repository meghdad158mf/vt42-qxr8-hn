name: Probe crawl (temporary)
on:
  push:
    branches: [claude/trusting-newton-h7wex5]
    paths: [scripts/crawl_hawza.py, .github/workflows/probe-crawl.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser "trafilatura>=2,<3"
      - run: python scripts/crawl_hawza.py --dry-run --debug "--only=ایرنا,خبرآنلاین,رکنا,ایران‌وایر,خبرگزاری صداوسیما,فارس"
