name: Probe crawl (temporary)
on:
  push:
    branches: [claude/trusting-newton-h7wex5]
    paths: [scripts/probe_crawl.py, .github/workflows/probe-crawl.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests trafilatura
      - run: python scripts/probe_crawl.py
