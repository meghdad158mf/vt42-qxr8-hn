# http → https برای دامنه (map در /etc/nginx/conf.d/jaryan-map.conf؛ برای IP خالی است)
if ($jaryan_https_redirect) { return 301 https://$host$request_uri; }
# صفحه‌ی اصلی سایت همان نشانی GitHub Pages است
location = / { return 302 /design/ita-monitoring-prototype.html; }
location ^~ /design/assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
location = /design/sw.js { add_header Cache-Control "no-cache"; }
location = /design/ita-monitoring-prototype.html { add_header Cache-Control "no-cache"; }
# گواهی Let's Encrypt (مرحله‌ی ۷)
location ^~ /.well-known/acme-challenge/ { root /var/lib/jaryan/acme-www; default_type text/plain; }
