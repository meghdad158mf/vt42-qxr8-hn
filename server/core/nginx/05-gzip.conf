# فشرده‌سازی پاسخ‌ها (۱.۱.۲): داده‌های رابط برنامه (JSON) و کد سایت حدود یک‌چهارم می‌شوند.
# عمداً اینجا (داخل server) و نه در http: nginx.conf اوبونتو خودش «gzip on» دارد و تکرار در
# همان سطح nginx را از کار می‌اندازد؛ تکرار در سطح server مجاز است و همان را بازنویسی می‌کند.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css text/plain
           application/xml text/xml image/svg+xml application/manifest+json application/vnd.pgrst.object+json;
