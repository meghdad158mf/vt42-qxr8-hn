# صفحه‌ی راه‌اندازی (فقط https؛ ورود با کلید اضطراری)
location = /setup { return 301 https://$host/setup/; }
location = /setup/health { proxy_pass http://127.0.0.1:8091; }
location ^~ /setup/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
# بارگذاری فایل انتقال داده (مرحله‌ی ۶) و فایل داده‌ی سرور خارجی — فایل بزرگ
location ^~ /setup/upload/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
